  ctx.fillText("出口 →", x + 20, groundY - 112);
}

function drawFlag() {
  const lv = Game.level;
  if (lv.isBonus) { drawBonusExit(lv.flagX); return; }
  const baseX = lv.flagX;
  const groundY = 13 * TILE;
  const topY = groundY - 8 * TILE;

  ctx.fillStyle = "#6b7280";
  ctx.fillRect(baseX + 10, topY, 5, 8 * TILE);
  ctx.fillStyle = "#d7dee8";
  ctx.fillRect(baseX + 11, topY, 2, 8 * TILE);

  // 顶部圆球
  ctx.fillStyle = "#f7d34d";
  ctx.beginPath();
  ctx.arc(baseX + 12.5, topY - 4, 7, 0, Math.PI * 2);
  ctx.fill();

  // 飘旗
  const wave = Math.sin(Game.tick * 4) * 5;
  ctx.fillStyle = "#e8483c";
  ctx.beginPath();
  ctx.moveTo(baseX + 12, topY + 12);
  ctx.lineTo(baseX + 12 + 52, topY + 26 + wave);
  ctx.lineTo(baseX + 12, topY + 42);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(baseX + 30, topY + 27 + wave * 0.6, 7, 0, Math.PI * 2);
  ctx.fill();

  // 底座
  ctx.fillStyle = "#8b6b45";
  ctx.fillRect(baseX + 2, groundY - 12, 22, 12);
  ctx.fillStyle = "#a5825a";
  ctx.fillRect(baseX + 4, groundY - 12, 18, 4);

  // 终点门（视觉提示）
  ctx.fillStyle = "rgba(255,255,255,.14)";
  ctx.fillRect(baseX - 4, topY - 20, 34, 8 * TILE + 20);
}

function drawFx() {
  for (const f of Game.fx) {
    ctx.save();
    ctx.globalAlpha = clamp(f.life / f.max, 0, 1);
    ctx.fillStyle = f.color;
    ctx.fillRect(f.x - f.size / 2, f.y - f.size / 2, f.size, f.size);
    ctx.restore();
  }
}

/** 飘分文字（世界坐标，随镜头移动） */
function drawPops() {
  if (!Game.pops.length) return;
  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "bold 16px Verdana, 'Microsoft YaHei', sans-serif";
  ctx.lineJoin = "round";
  for (const q of Game.pops) {
    ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(10,18,32,.7)";
    ctx.strokeText(q.text, q.x, q.y);
    ctx.fillStyle = q.color;
    ctx.fillText(q.text, q.x, q.y);
  }
  ctx.restore();
}

function drawDebris() {
  for (const d of Game.debris) {
    if (d.x < Game.camX - 60 || d.x > Game.camX + VIEW_W + 60) continue;
    ctx.save();
    ctx.globalAlpha = clamp(d.life / 1.8, 0, 1);
    ctx.translate(d.x, d.y);
    ctx.rotate(d.rot);
    const s = d.size;
    ctx.fillStyle = "#c1703f";
    ctx.fillRect(-s / 2, -s / 2, s, s);
    ctx.fillStyle = "#d98d58";
    ctx.fillRect(-s / 2, -s / 2, s, 3);
    ctx.fillStyle = "#8d4d26";
    ctx.fillRect(-s / 2, s / 2 - 3, s, 3);
    ctx.restore();
  }
}

/* ============================================================
   渲染 · 角色与敌人
   ============================================================ */
/** 无敌星残影：金色半透明残像，越旧越淡 */
function drawStarTrail() {
  if (!Game.starTrail.length) return;
  for (const t of Game.starTrail) {
    ctx.save();
    ctx.globalAlpha = 0.16 * clamp(t.life / 0.28, 0, 1);
    ctx.fillStyle = "#ffe066";
    ctx.fillRect(t.x, t.y, t.w, t.h);
    ctx.restore();
  }
}

function drawPlayer() {
  const p = Game.player;
  if (!p || (p.dead && p.deadTimer <= 0)) return;

  const walking = p.onGround && Math.abs(p.vx) > 24;
  const swing = walking ? Math.sin(p.animTime * 2.4) : 0;
  const bob = walking ? Math.abs(Math.sin(p.animTime * 2.4)) * 1.5 : 0;
  const scaleY = p.h / 30;
  const starFlash = p.star > 0 && Math.floor(Game.tick * 12) % 2 === 0;

  ctx.save();
  ctx.translate(p.x + p.w / 2, p.y + p.h - 30 * scaleY - bob + (p.dead ? -6 : 0));
  ctx.scale(p.dir, scaleY);
  if (p.dead) ctx.rotate(0.35);

  const skin = starFlash ? "#fff2a8" : "#f2c19a";
  const fiery = p.fire && !starFlash;
  const red = starFlash ? "#fff6c8" : (fiery ? "#f7f7f7" : "#e14b3f");
  const redDark = starFlash ? "#ffe680" : (fiery ? "#d5d5d5" : "#b7362c");
  const blue = starFlash ? "#ffe066" : (fiery ? "#e14b3f" : "#2f5bd6");
  const blueDark = starFlash ? "#e6b800" : (fiery ? "#b7362c" : "#22409b");

  // 帽子
  ctx.fillStyle = red;
  ctx.fillRect(-11, 0, 22, 6);
  ctx.fillStyle = redDark;
  ctx.fillRect(1, 4, 12, 3);

  // 脸
  ctx.fillStyle = skin;
  ctx.fillRect(-9, 6, 18, 9);
  // 眼睛
  ctx.fillStyle = "#23304a";
  ctx.fillRect(3, 8, 3, 4);
  ctx.fillRect(-6, 8, 3, 4);
  // 胡子
  ctx.fillStyle = "#4a3324";
  ctx.fillRect(1, 12, 7, 2);

  // 上衣与手臂
  ctx.fillStyle = red;
  ctx.fillRect(-10, 15, 20, 8);
  ctx.fillRect(-13, 16, 4, 7);
  ctx.fillRect(9, 16, 4, 7);
  ctx.fillStyle = skin;
  ctx.fillRect(-13, 22, 4, 3);
  ctx.fillRect(9, 22, 4, 3);

  // 背带裤
  ctx.fillStyle = blue;
  ctx.fillRect(-8, 18, 16, 9);
  ctx.fillStyle = "#ffd447";
  ctx.fillRect(-7, 19, 2, 2);
  ctx.fillRect(5, 19, 2, 2);

  // 腿
  ctx.fillStyle = blueDark;
  if (!p.onGround) {
    ctx.fillRect(-9, 26, 7, 4);
    ctx.fillRect(2, 26, 7, 4);
    ctx.fillStyle = "#5b3a20";
    ctx.fillRect(-10, 28, 8, 2);
    ctx.fillRect(3, 28, 8, 2);
  } else {
    const l1 = swing * 2.2;
    const l2 = -swing * 2.2;
    ctx.fillRect(-7 + l1, 26, 6, 4);
    ctx.fillRect(1 + l2, 26, 6, 4);
    ctx.fillStyle = "#5b3a20";
    ctx.fillRect(-8 + l1, 29, 8, 2);
    ctx.fillRect(1 + l2, 29, 8, 2);
  }
  ctx.restore();
}

function drawCannons() {
  const lv = Game.level;
  for (const c of lv.cannons) {
    if (!c.alive) continue;
    if (c.x < Game.camX - 80 || c.x > Game.camX + VIEW_W + 80) continue;

    // 底座
    ctx.fillStyle = "#3a4354";
    ctx.fillRect(c.x, c.y + 14, c.w, c.h - 14);
    ctx.fillStyle = "#59647a";
    ctx.fillRect(c.x + 3, c.y + 17, c.w - 6, 5);

    // 炮身
    ctx.fillStyle = "#2b3243";
    ctx.fillRect(c.x + 2, c.y + 4, c.w - 4, 14);
    ctx.fillStyle = "#4c586e";
    ctx.fillRect(c.x + 5, c.y + 6, c.w - 10, 4);

    // 炮口朝向玩家
    const dir = c.dir || 1;
    ctx.fillStyle = "#151a24";
    ctx.fillRect(dir > 0 ? c.x + c.w - 8 : c.x - 4, c.y + 7, 12, 8);
    ctx.fillStyle = "#0d1118";
    ctx.fillRect(dir > 0 ? c.x + c.w + 1 : c.x - 3, c.y + 9, 3, 4);

    // 开火闪光
    if (c.fireT > 0) {
      ctx.save();
      ctx.globalAlpha = clamp(c.fireT / 0.18, 0, 1);
      ctx.fillStyle = "#ffd166";
      ctx.beginPath();
      ctx.arc(c.x + c.w / 2 + dir * 20, c.y + 11, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 铆钉
    ctx.fillStyle = "#7f8ea6";
    ctx.fillRect(c.x + 5, c.y + 22, 5, 5);
    ctx.fillRect(c.x + c.w - 10, c.y + 22, 5, 5);
  }
}

function drawBullets() {
  const lv = Game.level;
  for (const b of lv.bullets) {
    if (!b.alive) continue;
    if (b.x < Game.camX - 60 || b.x > Game.camX + VIEW_W + 60) continue;
    const cx = b.x + b.w / 2;
    const cy = b.y + b.h / 2;
    const dir = b.vx >= 0 ? 1 : -1;

    // 尾迹
    ctx.fillStyle = "rgba(255,180,90,.35)";
    ctx.beginPath();
    ctx.ellipse(cx - dir * 13, cy, 8, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    // 弹体
    ctx.fillStyle = "#2b3243";
    ctx.beginPath();
    ctx.ellipse(cx, cy, 10, 7.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#59647a";
    ctx.beginPath();
    ctx.ellipse(cx - dir * 2, cy - 2, 5, 3.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#151a24";
    ctx.beginPath();
    ctx.ellipse(cx + dir * 6, cy, 3, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    // 眼睛
    ctx.fillStyle = "#ffd166";
    ctx.fillRect(cx + dir * 2 - 1.5, cy - 2, 3, 3);
  }
}

function drawEnemies() {
  const lv = Game.level;
  for (const e of lv.enemies) {
    if (!e.alive) continue;
    if (e.x < Game.camX - 60 || e.x > Game.camX + VIEW_W + 60) continue;

    const squash = e.dead > 0;
    ctx.save();
    ctx.translate(e.x + e.w / 2, e.y + e.h);
    if (squash) ctx.scale(1.15, 0.55);

    const step = Math.sin(e.anim * 9) * 2;

    if (e.type === "lava") {
      // 岩浆泡：橙红色发光球体，贴着熔岩表面跳动
      const r = 11 + Math.sin(e.anim * 10) * 1.5;
      ctx.save();
      ctx.shadowColor = "rgba(255,120,20,.85)";
      ctx.shadowBlur = 18;
      ctx.fillStyle = "#ff5a00";
      ctx.beginPath();
      ctx.ellipse(0, -13, r * 0.9, r, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = "#ff9a1f";
      ctx.beginPath();
      ctx.ellipse(-r * 0.18, -16, r * 0.45, r * 0.6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff2a8";
      ctx.beginPath();
      ctx.ellipse(-r * 0.28, -17, r * 0.16, r * 0.24, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (e.type === "koopa" || e.type === "firekoopa") {
      const fire = e.type === "firekoopa";
      const shellOuter = fire ? "#c72d12" : "#2fa84f";
      const shellInner = fire ? "#ff8a3c" : "#8be06a";
      const shellDark = fire ? "#7a1a08" : "#1b7a37";
      const skinA = fire ? "#ffcf7a" : "#f5d76e";
      const skinB = fire ? "#e8892a" : "#e0b93c";
      const shellOnly = e.state !== "walk";
      if (!shellOnly) {
        // 脚
        ctx.fillStyle = fire ? "#8a3a12" : "#f0c14b";
        ctx.fillRect(-9 + step, -5, 8, 5);
        ctx.fillRect(1 - step, -5, 8, 5);
        // 头
        const hx = e.vx >= 0 ? 5 : -17;
        ctx.fillStyle = skinA;
        ctx.fillRect(hx, -25, 12, 12);
        ctx.fillStyle = skinB;
        ctx.fillRect(hx, -14, 12, 3);
        ctx.fillStyle = "#1d2635";
        ctx.fillRect(hx + (e.vx >= 0 ? 7 : 2), -21, 3, 4);
        ctx.fillStyle = shellOuter;
        ctx.fillRect(hx + 1, -28, 10, 4);
      }
      // 龟壳
      const sy = shellOnly ? -19 : -23;
      const sw = shellOnly ? 26 : 22;
      const sh = shellOnly ? 19 : 16;
      ctx.fillStyle = shellOuter;
      ctx.beginPath();
      ctx.ellipse(0, sy + sh / 2, sw / 2, sh / 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = shellInner;
      ctx.beginPath();
      ctx.ellipse(0, sy + sh / 2 - 2, sw / 2 - 4, sh / 2 - 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#e8f7d8";
      for (let i = -1; i <= 1; i++) ctx.fillRect(i * 7 - 1, sy + 5, 2, sh - 8);
      if (shellOnly) {
        ctx.fillStyle = shellDark;
        ctx.fillRect(-9, sy + sh - 5, 18, 3);
      }
      if (e.state === "slide") {
        const dir = e.vx > 0 ? -1 : 1;
        ctx.fillStyle = "rgba(255,255,255,.55)";
        ctx.fillRect(dir * 20, sy + 5, 8, 3);
        ctx.fillRect(dir * 26, sy + 11, 5, 3);
      }
    } else if (e.type === "flyer") {
      // 翅膀（上下扇动）
      const flap = Math.sin(e.anim * 14) * 0.55;
      ctx.fillStyle = "#e8f7d8";
      ctx.save();
      ctx.translate(-11, -18);
      ctx.rotate(-0.45 - flap);
      ctx.beginPath();
      ctx.ellipse(0, 0, 12, 5.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.save();
      ctx.translate(11, -18);
      ctx.rotate(0.45 + flap);
      ctx.beginPath();
      ctx.ellipse(0, 0, 12, 5.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 龟壳
      ctx.fillStyle = "#2fa84f";
      ctx.beginPath();
      ctx.ellipse(0, -14, 11, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#8be06a";
      ctx.beginPath();
      ctx.ellipse(0, -15, 7.5, 8.5, 0, 0, Math.PI * 2);
      ctx.fill();

      // 头
      const fhx = e.vx >= 0 ? 7 : -17;
      ctx.fillStyle = "#f5d76e";
      ctx.fillRect(fhx, -29, 11, 11);
      ctx.fillStyle = "#e0b93c";
      ctx.fillRect(fhx, -20, 11, 3);
      ctx.fillStyle = "#1d2635";
      ctx.fillRect(fhx + (e.vx >= 0 ? 6 : 2), -26, 3, 4);
      ctx.fillStyle = "#2fa84f";
      ctx.fillRect(fhx + 1, -32, 9, 4);
    } else {
      // 脚
      ctx.fillStyle = "#3b2a1b";
      ctx.fillRect(-10 + step, -4, 8, 4);
      ctx.fillRect(2 - step, -4, 8, 4);

      // 身体（火系栗子怪：焦炭色 + 橙色裂缝）
      const fire = e.type === "firegoomba";
      ctx.fillStyle = fire ? "#4a2418" : "#a8542c";
      ctx.fillRect(-11, -20, 22, 16);
      ctx.fillStyle = fire ? "#2e1510" : "#8b3f1e";
      ctx.fillRect(-11, -8, 22, 4);
      ctx.fillStyle = fire ? "#ff7a18" : "#c9713c";
      ctx.fillRect(-8, -18, 16, 5);

      // 眼睛
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(-8, -15, 6, 6);
      ctx.fillRect(2, -15, 6, 6);
      ctx.fillStyle = "#1d2635";
      ctx.fillRect(-6, -13, 3, 4);
      ctx.fillRect(3, -13, 3, 4);

      // 眉毛
      ctx.fillStyle = "#5c2d12";
      ctx.fillRect(-8, -17, 6, 2);
      ctx.fillRect(2, -17, 6, 2);
    }
    ctx.restore();
  }
}

/* ============================================================
   渲染 · 关底 Boss
   ============================================================ */
function drawBoss() {
  const lv = Game.level;
  const b = lv && lv.boss;
  if (!b || (!b.alive && b.deadT <= 0)) return;
  if (b.x > Game.camX + VIEW_W + 120 || b.x + b.w < Game.camX - 120) return;

  const shrink = b.alive ? 1 : Math.max(0.35, b.deadT / 0.9);
  const flash = b.invuln > 0 && Math.floor(Game.tick * 16) % 2 === 0;
  const step = Math.sin(b.anim * 7) * 4;

  ctx.save();
  ctx.globalAlpha = b.alive ? 1 : clamp(b.deadT / 0.9, 0, 1);
  ctx.translate(b.x + b.w / 2, b.y + b.h);
  ctx.scale((b.vx >= 0 ? 1 : -1) * shrink, shrink);

  // 脚
  ctx.fillStyle = "#e8b83c";
  ctx.fillRect(-24 + step, -10, 18, 10);
  ctx.fillRect(6 - step, -10, 18, 10);

  // 背上的尖刺
  ctx.fillStyle = "#d94f3d";
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.moveTo(i * 18, -70);
    ctx.lineTo(i * 18 + 7, -56);
    ctx.lineTo(i * 18 - 7, -56);
    ctx.closePath();
    ctx.fill();
  }

  // 龟壳
  ctx.fillStyle = "#2fa84f";
  ctx.beginPath();
  ctx.ellipse(0, -32, 30, 26, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#8be06a";
  ctx.beginPath();
  ctx.ellipse(0, -34, 23, 19, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#e8f7d8";
  for (let i = -2; i <= 2; i++) ctx.fillRect(i * 10 - 1, -48, 2, 28);

  // 头（朝向前进方向）
  ctx.fillStyle = flash ? "#ffffff" : "#f5d76e";
  ctx.fillRect(14, -54, 26, 24);
  ctx.fillStyle = "#e0b93c";
  ctx.fillRect(14, -33, 26, 5);
  // 眼睛
  ctx.fillStyle = "#1d2635";
  ctx.fillRect(31, -48, 5, 7);
  ctx.fillRect(21, -48, 5, 7);
  // 眉毛（显得凶一点）
  ctx.fillStyle = "#8a4a22";
  ctx.fillRect(31, -51, 6, 2);
  ctx.fillRect(20, -51, 6, 2);

  ctx.restore();

  // 血条
  if (b.alive) {
    const w = 60, cx = b.x + b.w / 2;
    ctx.save();
    ctx.fillStyle = "rgba(10,18,32,.65)";
    ctx.fillRect(cx - w / 2, b.y - 92, w, 8);
    ctx.fillStyle = b.hp > 1 ? "#ff6b5e" : "#ffd447";
    ctx.fillRect(cx - w / 2 + 1, b.y - 91, (w - 2) * Math.max(0, b.hp / b.maxHp), 6);
    ctx.restore();
  }
}

function drawOverlay() {
  const blink = Math.sin(Game.tick * 3.4) > -0.2;

  if (Game.phase === "title") {
    const lines = [
      "← → 移动　↑ / 空格 跳跃（长按更高）　↓ 钻水管",
      "顶砖拿金币、踩乌龟缩壳，再把壳踢出去撞怪",
      "变大（蘑菇 / 火焰花）后按 K / X 吐火球",
      "1-3 / 2-3 终点有 Boss 把守，把它踩倒才能打开城门",
      "2-1 起进入火山世界：岩浆泡踩不灭，只能躲",
      "满 " + COINS_PER_LIFE + " 金币自动 1UP；掉坑会从存档点复活",
    ];
    if (Game.unlocked > 0) {
      lines.push("已解锁 " + (Game.unlocked + 1) + " / " + LEVEL_SPECS.length + " 关　按 C 继续");
    }
    const sel = clamp(Game.selectIndex, 0, LEVEL_SPECS.length - 1);
    const selBest = Game.levelBests[sel];
    lines.push("← → 选关：" + LEVEL_SPECS[sel].name + (selBest ? "　最佳 " + selBest : ""));
    lines.push(blink ? "按 Enter 开始所选关卡（所有关卡都可直接选）" : " ");
    drawCenterPanel("超级马里奥", lines, "#ffd447");
  } else if (Game.phase === "paused") {
    drawCenterPanel("已暂停", ["按 P 继续　·　R 重来本关"], "#8fd3ff");
  } else if (Game.phase === "levelclear") {
    // 结算逐条出现：旗杆分 → 金币 → 时间奖励 → 本关得分/最高分
    const cd = Game.clearData || {
      t: 0, bonus: 0, gained: 0, flagBonus: 500, lvScore: 0, levelBest: 0, newRecord: false,
    };
    const lines = [];
    if (cd.t > 0.1) lines.push("旗杆奖励 +" + cd.flagBonus);
    if (cd.t > 0.55) lines.push("金币 " + Game.coins + " 枚");
    if (cd.t > 1.0) lines.push("剩余时间 → +" + cd.gained + " 分");
    if (cd.t > 1.5) lines.push("本关得分 " + String(cd.lvScore || 0).padStart(6, "0"));
    if (cd.t > 1.9) {
      lines.push("本关最高 " + String(cd.levelBest || 0).padStart(6, "0") +
        (cd.newRecord ? "　新纪录！" : ""));
    }
    drawCenterPanel(Game.level.name + " 完成！", lines.length ? lines : ["…"], "#7fd4a0");
  } else if (Game.phase === "gameover") {
    drawCenterPanel("游戏结束", [
      "最终分数 " + String(Game.score).padStart(6, "0"),
      "金币 " + Game.coins + " 枚　最高分 " + String(Game.best).padStart(6, "0"),
      blink ? "按 Enter 重新开始" : " ",
    ], "#ff8a80");
  } else if (Game.phase === "win") {
    drawCenterPanel("全部通关！", [
      "你走完了全部 " + LEVEL_SPECS.length + " 关",
      "最终分数 " + String(Game.score).padStart(6, "0"),
      "最高分 " + String(Game.best).padStart(6, "0"),
      blink ? "按 Enter 再来一轮" : " ",
    ], "#ffd447");
  }

  if (Game.toastTimer > 0 && Game.phase !== "title") {
    ctx.save();
    ctx.globalAlpha = clamp(Game.toastTimer / 1.4, 0, 1);
    ctx.fillStyle = "rgba(10,18,32,.7)";
    ctx.fillRect(VIEW_W / 2 - 110, 84, 220, 40);
    ctx.fillStyle = "#e8eefb";
    ctx.font = "bold 17px Verdana, 'Microsoft YaHei', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(Game.toastText, VIEW_W / 2, 104);
    ctx.restore();
  }
}

/* ============================================================
   主循环与启动
   ============================================================ */
let lastTime = 0;

/* ============================================================
   手柄支持：方向键 + A/B/X 映射到移动 / 跳跃 / 火球
   ============================================================ */
const Pad = { active: false };
function pollGamepad() {
  if (!navigator.getGamepads) return;
  let pad = null;
  try {
    for (const p of navigator.getGamepads()) {
      if (p && p.connected) { pad = p; break; }
    }
  } catch (e) { return; }

  if (!pad) {
    if (Pad.active) {
      Pad.active = false;
      for (const k of ["left", "right", "jump", "shoot", "down"]) setAction(k, false);
    }
    return;
  }

  const btn = (i) => !!(pad.buttons[i] && pad.buttons[i].pressed);
  const ax = pad.axes[0] || 0;
  const st = {
    left: btn(14) || ax < -0.4,
    right: btn(15) || ax > 0.4,
    jump: btn(0) || btn(3),
    shoot: btn(2) || btn(1),
    down: btn(13),
  };
  const any = st.left || st.right || st.jump || st.shoot || st.down;
  if (!any && !Pad.active) return;   // 没手柄输入时不干扰键盘
  Pad.active = any;
  for (const k of Object.keys(st)) setAction(k, st[k]);
}

function frame(now) {
  if (!lastTime) lastTime = now;
  const dt = Math.min((now - lastTime) / 1000, 1 / 30);
  lastTime = now;
  pollGamepad();
  update(dt);
  render();
  requestAnimationFrame(frame);
}

/* 供外部工具 / 自动化脚本使用的入口 */
window.MarioGame = Game;
window.MarioAPI = {
  start() { if (Game.phase === "title") Game.onConfirm(); },
  /** 读取当前键位（动作 → 键码数组） */
  bindings() { return JSON.parse(JSON.stringify(KEY_BINDS)); },
  /** 自定义键位，例如 setBindings({ jump: ["KeyL"], shoot: ["KeyI"] }) */
  setBindings(map) {
    for (const k of Object.keys(DEFAULT_BINDS)) {
      if (Array.isArray(map[k]) && map[k].length) KEY_BINDS[k] = map[k].slice();
    }
    saveBinds();
    return this.bindings();
  },
  resetBindings() {
    for (const k of Object.keys(DEFAULT_BINDS)) KEY_BINDS[k] = DEFAULT_BINDS[k].slice();
    saveBinds();
    return this.bindings();
  },
  /** 运行内置自测（页面加 ?test=1 也会自动运行） */
  selfTest() { return runSelfTest(); },
  restart() {
    if (Game.player) { Game.player.big = false; Game.player.fire = false; Game.player.star = 0; }
    Game.score = 0; Game.lives = 3; Game.coins = 0; Game.loadLevel(0);
  },
  jumpTo(levelIndex) { Game.loadLevel(levelIndex); },
  bonus() { if (!Game.inBonus) Game.loadBonus(); },
  state() {
    const p = Game.player;
    return {
      phase: Game.phase,
      level: Game.levelIndex + 1,
      levelName: Game.level.name,
      score: Game.score,
      best: Game.best,
      coins: Game.coins,
      lives: Game.lives,
      time: Math.ceil(Game.timeLeft),
      inBonus: Game.inBonus,
      checkpointActive: Game.checkpointActive,
      checkpointX: Math.round(Game.checkpointX),
      player: p ? { x: Math.round(p.x), y: Math.round(p.y), h: p.h, big: p.big, fire: !!p.fire, star: +p.star.toFixed(2), onGround: p.onGround, dir: p.dir } : null,
      fireballs: Game.fireballs.length,
      combo: Game.combo,
      unlocked: Game.unlocked,
      levelBest: Game.levelBests[Game.levelIndex] || 0,
      pipeAnim: Game.pipeAnim ? Game.pipeAnim.mode : null,
      starTrail: Game.starTrail.length,
      musicScene: Music.scene,
      boss: Game.level.boss
        ? { hp: Game.level.boss.hp, alive: Game.level.boss.alive, maxHp: Game.level.boss.maxHp }
        : null,
      progress: p ? Math.min(1, +(p.x / Game.level.flagX).toFixed(3)) : 0,
    };
  },
};

/* ============================================================
   内置自测：页面加 ?test=1 或调用 MarioAPI.selfTest()
   ============================================================ */
function runSelfTest() {
  const results = [];
  const check = (name, ok) => { results.push({ name, ok: !!ok }); return !!ok; };
  const step = (n) => { for (let i = 0; i < n; i++) update(1 / 60); };
  let bakU = null, bakB = null;
  try {
    bakU = localStorage.getItem("mario_unlocked");
    bakB = localStorage.getItem("mario_level_bests");
  } catch (e) {}

  try {
    check("关卡数据完整",
      LEVEL_SPECS.length === 6 && typeof makeLevel(LEVEL_SPECS[0]).grid[0][0] === "number");

    Game.loadLevel(1);
    check("1-2 有炮台", Game.level.cannons.length === 2);
    check("1-2 有飞行龟", Game.level.enemies.filter((e) => e.type === "flyer").length === 2);
    check("1-2 有横向平台", Game.level.lifts.some((l) => l.axis === "x"));

    const c = Game.level.cannons[0];
    Game.player.invuln = 5;
    Game.player.x = c.x - 650;
    Game.player.y = 12 * TILE - Game.player.h;
    // 逐帧检测：炮弹飞行途中可能被地形或玩家清掉，只看“是否发射过”
    let fired = false;
    for (let i = 0; i < 180 && !fired; i++) {
      update(1 / 60);
      fired = Game.level.bullets.length > 0;
    }
    check("炮台会开火", fired);

    Game.loadLevel(1);
    const fy = Game.level.enemies.find((e) => e.type === "flyer");
    const fy0 = fy.y;
    // 初相位是随机的，用 2 秒内的最大偏移判定，避免正弦重合导致偶发失败
    let flyDev = 0;
    for (let i = 0; i < 120; i++) {
      update(1 / 60);
      flyDev = Math.max(flyDev, Math.abs(fy.y - fy0));
    }
    check("飞行龟会浮动", flyDev > 8);

    Game.loadLevel(2);
    check("1-3 Boss 就位", !!Game.level.boss && Game.level.boss.hp === 5);
    check("城门初始实心", Game.level.grid[7][118] === T.STONE);

    // 火山世界（2-1 ~ 2-3）
    Game.loadLevel(3);
    check("2-1 是火山地图", Game.level.theme === "volcano");
    check("2-1 有岩浆泡", Game.level.enemies.filter((e) => e.type === "lava").length === 3);
    step(90);
    check("岩浆泡会跳动", Game.level.enemies.some((e) => e.type === "lava" && e.vy !== 0));
    Game.loadLevel(5);
    check("2-3 Boss 就位", !!Game.level.boss && Game.level.boss.hp === 6);
    check("2-3 有火系龟", Game.level.enemies.filter((e) => e.type === "firekoopa").length === 2);
    render();

    // 标题界面自由选关 + 怪物密度上限
    Game.phase = "title";
    Game.selectIndex = 3;
    Game.onConfirm();
    check("可自由选择火山关卡开局", Game.levelIndex === 3 && Game.level.theme === "volcano");
    check("每关怪物数量受控", LEVEL_SPECS.every((s) => (s.enemies || []).length <= 17));

    // 变大后无需火焰花也能吐火球
    Game.loadLevel(0);
    Game.player.big = true; Game.player.fire = false;
    Game.player.shootCd = 0;
    Game.fireballs.length = 0;
    Input.shootPressed = true;
    step(1);
    check("变大后能吐火球", Game.fireballs.length > 0);

    // 走路小怪会掉进坑，而不是在边缘掉头
    Game.loadLevel(1);
    const gm = Game.level.enemies.find((e) => e.type === "goomba");
    gm.x = 21 * TILE - gm.w - 2;
    gm.y = 12 * TILE + 6;
    gm.vx = 52; gm.vy = 0;
    step(50);
    check("小怪会掉进坑里", gm.y > 13 * TILE);

    // 滑行龟壳撞墙后停住，不再来回弹射
    Game.loadLevel(1);
    const sh = Game.level.enemies.find((e) => e.type === "koopa");
    sh.state = "slide"; sh.h = 20;
    sh.y = 13 * TILE - sh.h;
    sh.x = 15 * TILE - sh.w;
    sh.vx = 380; sh.vy = 0;
    for (let i = 0; i < 40 && sh.vx !== 0; i++) update(1 / 60);
    check("龟壳撞墙后停下", sh.vx === 0 && sh.state === "shell");

    // 水管进 / 出
    Game.loadLevel(0);
    const pd = Game.level.pipeDowns[0];
    Game.player.x = pd.x + 18;
    Game.player.y = pd.topY - Game.player.h;
    Game.player.vy = 0;
    Game.player.onGround = true;
    EasyInput.down("down");
    step(1);
    check("进水管动画开始", Game.pipeAnim && Game.pipeAnim.mode === "in");
    step(30);
    check("进入地下金币房", Game.inBonus && Music.bonus);
    Game.player.x = Game.level.flagX - 10;
    Game.player.y = 13 * TILE - Game.player.h;
    step(1);
    check("出水管动画开始", Game.pipeAnim && Game.pipeAnim.mode === "out");
    step(30);
    check("回到地面", !Game.inBonus && !Game.pipeAnim && !Music.bonus);
    EasyInput.releaseAll();

    // 进度存档往返
    Game.unlocked = 2;
    Game.levelBests = { 0: 1234, 2: 5678 };
    Game.saveProgress();
    Game.unlocked = 0;
    Game.levelBests = {};
    Game.loadProgress();
    check("进度存档往返", Game.unlocked === 2 && Game.levelBests[2] === 5678);

    // 键位重映射
    const bakBinds = JSON.parse(JSON.stringify(KEY_BINDS));
    MarioAPI.setBindings({ jump: ["KeyL"] });
    check("键位可重映射", actionForCode("KeyL") === "jump" && actionForCode("Space") === null);
    for (const k of Object.keys(bakBinds)) KEY_BINDS[k] = bakBinds[k];
    saveBinds();

    render();
    check("渲染无异常", true);
  } catch (e) {
    check("异常：" + e.message, false);
  }

  // 还原进度与游戏状态
  try {
    if (bakU === null) localStorage.removeItem("mario_unlocked");
    else localStorage.setItem("mario_unlocked", bakU);
    if (bakB === null) localStorage.removeItem("mario_level_bests");
    else localStorage.setItem("mario_level_bests", bakB);
  } catch (e) {}
  Game.loadProgress();
  Game.score = 0;
  Game.lives = 3;
  Game.coins = 0;
  Game.loadLevel(0);
  Game.phase = "title";
  Music.stop();
  Music.setScene(false);

  const pass = results.filter((r) => r.ok).length;
  const panel = document.createElement("div");
  panel.id = "selftest";
  panel.style.cssText =
    "position:fixed;left:12px;top:12px;right:12px;bottom:12px;z-index:99;overflow:auto;" +
    "background:rgba(8,14,26,.95);color:#dfe6f5;font:13px/1.7 monospace;padding:14px;" +
    "border-radius:10px;border:1px solid #38445e;white-space:pre";
  panel.textContent = "内置自测 " + pass + " / " + results.length +
    "\n点击本面板可关闭\n\n" +
    results.map((r) => (r.ok ? "PASS " : "FAIL ") + r.name).join("\n");
  panel.addEventListener("click", () => panel.remove());
  document.body.appendChild(panel);

  document.title = pass === results.length ? "ALLPASS" : "FAIL" + (results.length - pass);
  const summary = { pass, total: results.length, results };
  window.__selfTest = summary;
  return summary;
}

Game.loadBest();
Game.loadProgress();
Game.loadLevel(0);
Game.phase = "title";
requestAnimationFrame(frame);

/* ?test=1：自动跑一遍内置自测（正式游玩不带这个参数） */
if (new URLSearchParams(location.search).get("test") === "1") {
  setTimeout(runSelfTest, 400);
}
</script>
